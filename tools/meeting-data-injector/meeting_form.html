<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toby AI 录音内容注入台</title>
<style>:root{--ink:#172019;--muted:#6c766e;--paper:#f3ede1;--card:#fffdf8;--green:#176b4a;--line:#d7d0c4}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0,#dce9d7 0,transparent 35%),linear-gradient(135deg,#f7f1e6,#ece4d6);font:16px/1.6 "Microsoft YaHei UI",sans-serif}main{width:min(1060px,calc(100% - 30px));margin:34px auto 70px}header{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:22px}h1{margin:0;font:700 clamp(32px,5vw,58px)/1.05 Georgia,"Microsoft YaHei UI",serif;letter-spacing:-1px}header p{max-width:470px;color:var(--muted);margin:0}.card{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 55px rgba(51,42,26,.09);padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:800;font-size:13px;letter-spacing:.03em}label span{display:block;margin-bottom:7px}.wide{grid-column:1/-1}input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:12px 14px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,107,74,.12)}#raw_text{min-height:350px;resize:vertical;font-size:16px;line-height:1.7}#summary{min-height:190px;resize:vertical}.hint{font-weight:400;color:var(--muted);margin-top:6px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px}button{border:0;border-radius:999px;padding:12px 19px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff;padding:14px 28px}.secondary{background:#e6ede5;color:var(--green)}.replace{margin-left:auto;display:flex;gap:8px;align-items:center}.replace input{width:auto}.result{display:none;margin-top:18px;padding:16px;border-radius:13px;background:#edf4ed;white-space:pre-wrap}.preview{display:none;margin-top:20px}.preview pre{overflow:auto;max-height:360px;background:#172019;color:#eaf3e8;border-radius:14px;padding:16px;font:13px/1.55 Consolas,monospace}.eyebrow{font-weight:900;letter-spacing:.13em;color:var(--green);font-size:12px}@media(max-width:760px){header{display:block}header p{margin-top:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.replace{margin-left:0;width:100%}}</style></head>
<body><main><header><div><div class="eyebrow">RECORDING DATA TOOL</div><h1>录音内容注入台</h1></div><p>适用于会议、访谈、课堂、补课、培训等录音场景。标题、摘要和逐字稿由上游 AI 一次生成；本工具只负责统一说话人、生成时间轴并写入数据库。</p></header>
<form id="form" class="card"><div class="grid">
<label><span>录音标题</span><input id="title" required placeholder="例如：初三一元二次函数一对一补习"></label>
<label><span>录音 ID（可选）</span><input id="meeting_id" type="number" placeholder="留空自动生成唯一 ID"></label>
<label class="wide"><span>内容摘要</span><textarea id="summary" required placeholder="粘贴 AI 生成的通用摘要。应覆盖主题、核心内容、关键结论或知识点、后续事项等与场景相关的信息。"></textarea><div class="hint">摘要必须提供，本工具不会调用大模型或自行总结。</div></label>
<label class="wide"><span>录音逐字稿</span><textarea id="raw_text" required placeholder="说话人1：……&#10;&#10;说话人2：……"></textarea><div class="hint">只需使用“说话人1、说话人2……”；不需要时间戳，工具会按文本长度自动生成。</div></label>
</div><div class="actions"><button type="button" class="secondary" id="example">载入教育场景示例</button><button class="primary" type="submit">整理并注入 MySQL</button><label class="replace"><input id="replace" type="checkbox"> 覆盖相同录音 ID</label></div><div id="result" class="result"></div></form>
<section id="preview" class="card preview"><h2>入库分段预览</h2><pre id="segmentsPreview"></pre></section>
</main><script>const $=id=>document.getElementById(id);const sample={title:'初三一元二次函数一对一补习',summary:'本次录音是一节初三数学一对一补习，核心内容为一元二次方程的定义、标准形式、因式分解法和公式法。老师先通过例题讲解如何识别二次项系数、一次项系数和常数项，随后带领学生完成从移项到求根的完整步骤。学生在符号处理和漏写两个解方面出现错误，经过纠正后能够独立完成基础题。关键知识点包括判别式的含义、两个实数根的条件以及解题后的代回检验。后续建议学生完成五道因式分解法练习和三道公式法练习，并重点检查负号与括号。',text:`说话人1：嗯，我们今天主要补一下这个一元二次方程。你先说说看，什么样的方程叫一元二次方程？\n\n说话人2：就是，呃，只有一个未知数，然后次数是二次的方程。\n\n说话人1：对，基本意思是对的。更准确一点，整理以后要能写成 ax² 加 bx 加 c 等于零，而且 a 不能等于零。这里为什么 a 不能是零？\n\n说话人2：因为 a 等于零的话，二次项就没了，就变成一元一次方程了。\n\n说话人1：没错。我们看第一题，x² 减 5x 加 6 等于零。你先别急着套公式，看看能不能因式分解。\n\n说话人2：是不是 x 减 2 乘以 x 减 3？所以 x 等于 2。嗯，不对，还有一个 x 等于 3。\n\n说话人1：对，你刚才差点漏了一个解。两个因式的乘积等于零，所以任意一个因式等于零都可以。这个这个地方考试特别容易丢分。\n\n说话人2：明白了，就是要分别写 x 减 2 等于零，或者 x 减 3 等于零。\n\n说话人1：好。下一题不能直接分解，我们用求根公式。先找 a、b、c，再算判别式。注意 b 是负数的时候，代入 b²一定要加括号。\n\n说话人2：我刚才就是把负号弄丢了。那我重新算一下，判别式大于零，所以有两个不相等的实数根。\n\n说话人1：这次对了。课后你做五道因式分解法和三道公式法，做完以后每一题都代回去检查，特别注意负号和两个解。\n\n说话人2：好，我今天晚上做完，明天把错题拍给你。`};$('example').onclick=()=>{$('title').value=sample.title;$('summary').value=sample.summary;$('raw_text').value=sample.text};$('form').onsubmit=async e=>{e.preventDefault();const box=$('result');box.style.display='block';box.textContent='正在统一说话人、生成时间轴并写入 MySQL...';const payload={title:$('title').value.trim(),meeting_id:$('meeting_id').value?Number($('meeting_id').value):null,user_id:1001,phone:'13800001001',summary:$('summary').value.trim(),raw_text:$('raw_text').value,replace:$('replace').checked};try{const r=await fetch('/api/meetings/from-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);box.textContent=`注入成功\n录音 ID：${j.meeting_id}\n标题：${j.title}\n逐字稿：${j.segment_count} 段\n\n接下来可在 ApiPost 主动测试 ingest 和 Bridge。`;$('segmentsPreview').textContent=j.segments.map((s,i)=>`${i+1}. [${s.begin_time}–${s.end_time} ms] ${s.speaker}：${s.content}`).join('\n\n');$('preview').style.display='block'}catch(err){box.textContent=`注入失败：${err.message}`}};$('example').click();</script></body></html>
