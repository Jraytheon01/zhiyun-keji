interface:
  display_name: "智云课迹学习助手"
  short_description: "基于真实课程证据完成四类学习互动并受控回流"
  default_prompt: "Use $zhiyun-keji-learning to run the requested course learning scenario from its action and course ID."

dependencies:
  tools:
    - type: "mcp"
      value: "zhiyun-learning"
      description: "读取可信课程依据、跨课检索、学习档案上下文并回流完整学习对话"
      transport: "streamable_http"
      url: "http://127.0.0.1:8768/mcp"

policy:
  allow_implicit_invocation: true
